<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://i.ytimg.com https://lh3.googleusercontent.com data:; font-src 'self';"
    />
    <title>Overtone</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="win">
      <!-- title bar ------------------------------------------------------->
      <header class="titlebar">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <span class="brand-name" data-i18n="app.name"></span>
        </div>
        <div class="titlebar-right">
          <button class="theme-pill" id="theme-toggle" type="button">
            <span id="theme-icon" aria-hidden="true">☾</span>
            <span id="theme-label" data-i18n="app.dark"></span>
          </button>
          <button class="winbtn" id="win-min" type="button" data-i18n-label="app.minimise">—</button>
          <button class="winbtn" id="win-max" type="button" data-i18n-label="app.maximise">▢</button>
          <button class="winbtn close" id="win-close" type="button" data-i18n-label="app.close">✕</button>
        </div>
      </header>

      <div class="body">
        <!-- sidebar ------------------------------------------------------->
        <nav class="sidebar">
          <label class="search">
            <span aria-hidden="true">⌕</span>
            <input id="search" type="text" data-i18n-placeholder="nav.search" placeholder="" autocomplete="off" />
          </label>

          <div class="nav" id="nav" role="tablist">
            <button class="nav-item" role="tab" data-panel="conn" aria-selected="true" type="button"><span data-i18n="nav.conn"></span><span class="nav-tail"><span class="dot" id="nav-dot-conn"></span></span>
            </button>
            <button class="nav-item" role="tab" data-panel="look" aria-selected="false" type="button" data-i18n="nav.look"></button>
            <button class="nav-item" role="tab" data-panel="lyr" aria-selected="false" type="button" data-i18n="nav.lyr"></button>
            <button class="nav-item" role="tab" data-panel="tr" aria-selected="false" type="button"><span data-i18n="nav.tr"></span><span class="nav-tail"><span class="chip" id="nav-badge-tr" data-i18n="app.off"></span></span>
            </button>
            <button class="nav-item" role="tab" data-panel="sys" aria-selected="false" type="button" data-i18n="nav.sys"></button>
            <button class="nav-item" role="tab" data-panel="log" aria-selected="false" type="button" data-i18n="nav.log"></button>
          </div>

          <div class="side-foot">
            <div class="row"><span class="dot" id="foot-discord"></span><span id="foot-discord-text" data-i18n="status.discord"></span></div>
            <div class="row"><span class="dot" id="foot-browser"></span><span id="foot-browser-text" data-i18n="status.browser"></span></div>
            <div class="row"><span data-i18n="app.version"></span><span id="foot-version" class="tag">—</span></div>
          </div>
        </nav>

        <!-- content ------------------------------------------------------->
        <div class="content">
          <div class="scroll" id="scroll">
            <!-- Verbindung -->
            <section class="panel" id="panel-conn" data-title="search.conn">
              <h2 data-i18n="conn.title"></h2>
              <p class="sub" data-i18n="conn.sub"></p>

              <div class="notice bad" id="notice-discord" hidden>
                <strong data-i18n="conn.noDiscord"></strong>
                <span id="notice-discord-text"></span>
                <div class="row"><button class="btn" id="btn-reconnect" type="button" data-i18n="app.retry"></button></div>
              </div>

              <div class="notice warn" id="notice-ext" hidden>
                <strong data-i18n="conn.extOutdated"></strong>
                <span id="notice-ext-text"></span>
              </div>

              <div class="card">
                <label class="field">
                  <span class="field-head">
                    <span class="label" data-i18n="conn.clientId"></span>
                    <button class="more" type="button" data-more="clientId" data-i18n="app.more"></button>
                  </span>
                  <input id="clientId" type="text" inputmode="numeric" data-i18n-placeholder="conn.clientIdPlaceholder" placeholder="" />
                  <span class="collapse" data-collapse="clientId"><span class="hint" data-i18n="conn.clientIdHelp"></span></span>
                </label>

                <div class="row">
                  <button class="btn primary" id="btn-reconnect2" type="button" data-i18n="conn.reconnect"></button>
                  <a class="btn" href="#" data-external="https://discord.com/developers/applications" data-i18n="conn.openPortal"></a>
                </div>
              </div>

              <div class="card">
                <label class="field">
                  <span class="field-head">
                    <span class="label" data-i18n="popup.bridgePort"></span>
                    <span class="chip" id="port-chip"></span>
                    <button class="more" type="button" data-more="port" data-i18n="app.more"></button>
                  </span>
                  <input id="port" class="narrow" type="number" min="1024" max="65535" placeholder="8787" />
                  <span class="collapse" data-collapse="port">
                    <span class="hint" data-i18n="conn.portHelp"></span>
                  </span>
                </label>
              </div>
            </section>

            <!-- Darstellung -->
            <section class="panel" id="panel-look" hidden data-title="search.look">
              <h2 data-i18n="look.title"></h2>
              <p class="sub" data-i18n="look.sub"></p>

              <div class="card">
                <div class="field">
                  <span class="field-head"><span class="label" data-i18n="look.activityType"></span></span>
                  <div class="segmented" data-seg="activityType">
                    <button type="button" data-value="auto" data-i18n="look.typeAuto"></button>
                    <button type="button" data-value="listening" data-i18n="look.typeListening"></button>
                    <button type="button" data-value="watching" data-i18n="look.typeWatching"></button>
                    <button type="button" data-value="playing" data-i18n="look.typePlaying"></button>
                  </div>
                  <p class="hint" data-i18n="look.typeHelp"></p>
                </div>

                <label class="field">
                  <span class="field-head">
                    <span class="label" data-i18n="look.activityName"></span>
                    <button class="more" type="button" data-more="activityName" data-i18n="app.more"></button>
                  </span>
                  <input id="activityName" type="text" placeholder="{artist} - {title}" />
                  <span class="row" style="margin-top: 8px">
                    <button class="token" type="button" data-token="{artist}">{artist}</button>
                    <button class="token" type="button" data-token="{title}">{title}</button>
                    <button class="token" type="button" data-token="{channel}">{channel}</button>
                  </span>
                  <span class="collapse" data-collapse="activityName">
                    <span class="hint" data-i18n="look.activityNameHelp"></span>
                  </span>
                </label>
              </div>

              <div class="card">
                <div class="switch-row" data-switch="showTimestamps"><span class="text" data-i18n="look.timestamps"></span></div>
                <div class="switch-row" data-switch="highResArtwork"><span class="text" data-i18n="look.highRes"></span></div>
                <div class="switch-row" data-switch="showButton"><span class="text" data-i18n="look.button"></span></div>
                <div class="subblock" data-sub="showButton">
                  <label class="field">
                    <span class="field-head"><span class="label" data-i18n="look.buttonLabel"></span></span>
                    <input id="buttonLabel" type="text" maxlength="32" data-i18n-placeholder="presence.watchButton" placeholder="" />
                  </label>
                  <div class="switch-row" data-switch="showChannelButton"><span class="text" data-i18n="look.channelButton"></span></div>
                </div>
                <div class="switch-row" data-switch="showStateBadge">
                  <span class="text"><span data-i18n="look.stateBadge"></span><small data-i18n="look.stateBadgeSub"></small></span>
                </div>
                <div class="switch-row" data-switch="showWhenBrowsing">
                  <span class="text"><span data-i18n="look.whenBrowsing"></span><small data-i18n="look.whenBrowsingSub"></small></span>
                </div>
                <div class="switch-row" data-switch="hideWhenPaused"><span class="text" data-i18n="look.hidePaused"></span></div>
                <div class="switch-row" data-switch="privacyMode">
                  <span class="text"><span data-i18n="tray.privacy"></span><small data-i18n="look.privacySub"></small></span>
                </div>
              </div>
            </section>

            <!-- Lyrics -->
            <section class="panel" id="panel-lyr" hidden data-title="search.lyr">
              <h2 data-i18n="lyr.title"></h2>
              <p class="sub" data-i18n="lyr.sub"></p>

              <div class="card">
                <div class="switch-row" data-switch="lyricsEnabled"><span class="text" data-i18n="lyr.enabled"></span></div>

                <div class="subblock" data-sub="lyricsEnabled">
                  <div class="field">
                    <span class="field-head">
                      <span class="label" data-i18n="lyr.source"></span>
                      <button class="more" type="button" data-more="lyricsSource" data-i18n="app.more"></button>
                    </span>
                    <div class="segmented" data-seg="lyricsSource">
                      <button type="button" data-value="auto" data-i18n="lyr.sourceAuto"></button>
                      <button type="button" data-value="captions" data-i18n="lyr.sourceCaptions"></button>
                      <button type="button" data-value="lrclib" data-i18n="lyr.sourceLrclib"></button>
                    </div>
                    <span class="collapse" data-collapse="lyricsSource">
                      <span class="hint" data-i18n="lyr.sourceHelp"></span>
                    </span>
                  </div>

                  <div class="field">
                    <span class="field-head"><span class="label" data-i18n="lyr.mode"></span></span>
                    <div class="segmented" data-seg="lyricsMode">
                      <button type="button" data-value="line" data-i18n="lyr.modeLine"></button>
                      <button type="button" data-value="block" data-i18n="lyr.modeBlock"></button>
                    </div>
                    <p class="hint" data-i18n="lyr.modeHelp"></p>
                  </div>

                  <div class="field" data-only="line">
                    <span class="field-head"><span class="label" data-i18n="lyr.combine"></span></span>
                    <div class="segmented" data-seg="lyricsCombine">
                      <button type="button" data-value="0" data-i18n="lyr.combineOff"></button>
                      <button type="button" data-value="1" data-i18n="lyr.combineStandard"></button>
                      <button type="button" data-value="1.5" data-i18n="lyr.combineMore"></button>
                      <button type="button" data-value="2" data-i18n="lyr.combineMax"></button>
                    </div>
                  </div>

                  <div class="switch-row" data-switch="lyricsMusicOnly"><span class="text" data-i18n="lyr.musicOnly"></span></div>
                  <div class="switch-row" data-switch="lyricsProminent"><span class="text" data-i18n="lyr.prominent"></span></div>
                  <div class="switch-row" data-switch="lyricsSave">
                    <span class="text"><span data-i18n="lyr.save"></span><small data-i18n="lyr.saveSub"></small></span>
                  </div>

                  <label class="field">
                    <span class="field-head"><span class="label" data-i18n="lyr.offset"></span></span>
                    <span class="slider-row">
                      <input id="lyricsOffset" type="range" min="-5" max="5" step="0.25" />
                      <span class="value" id="lyricsOffsetOut"></span>
                    </span>
                    <span class="hint" data-i18n="lyr.offsetHelp"></span>
                  </label>

                  <div class="row">
                    <button class="btn" id="btn-clear-cache" type="button" data-i18n="lyr.clearCache"></button>
                    <button class="btn" id="btn-open-lyrics" type="button" data-i18n="lyr.openFolder"></button>
                  </div>
                </div>
              </div>
            </section>

            <!-- Transkription -->
            <section class="panel" id="panel-tr" hidden data-title="search.tr">
              <h2 data-i18n="tr.title"></h2>
              <p class="sub" data-i18n="tr.sub"></p>

              <div class="job" id="transcribe-job">
                <div class="spinner" id="transcribe-spinner" hidden></div>
                <div class="job-text">
                  <p class="job-line" id="transcribe-phase" data-i18n="tr.idle"></p>
                  <p class="job-detail" id="transcribe-detail"></p>
                </div>
              </div>

              <div class="card">
                <div class="switch-row" data-switch="transcribeEnabled">
                  <span class="text"><span data-i18n="tr.enabled"></span><small data-i18n="tr.enabledSub"></small></span>
                </div>

                <div class="subblock" data-sub="transcribeEnabled">
                  <div class="switch-row" data-switch="transcribeEvenWithCaptions">
                    <span class="text" data-i18n="tr.evenWithCaptions"></span>
                  </div>

                  <label class="field">
                    <span class="field-head">
                      <span class="label" data-i18n="sys.language"></span>
                      <span class="label-note" data-i18n="tr.languageNote"></span>
                    </span>
                    <input id="transcribeLanguage" class="narrow" type="text" maxlength="5" data-i18n-placeholder="tr.languagePlaceholder" placeholder="" />
                    <span class="hint" data-i18n="tr.languageHelp"></span>
                  </label>

                  <label class="field">
                    <span class="field-head"><span class="label" data-i18n="tr.maxMinutes"></span></span>
                    <input id="transcribeMaxMinutes" class="mid" type="number" min="0" max="180" />
                    <span class="hint" data-i18n="tr.maxMinutesHelp"></span>
                  </label>

                  <div class="field">
                    <span class="field-head"><span class="label" data-i18n="tr.model"></span></span>
                    <div class="segmented" data-seg="transcribeModel">
                      <button type="button" data-value="tiny">tiny</button>
                      <button type="button" data-value="base">base</button>
                      <button type="button" data-value="small">small</button>
                      <button type="button" data-value="medium" style="flex: 1.4" data-i18n="tr.modelDefault"></button>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <!-- System -->
            <section class="panel" id="panel-sys" hidden data-title="search.sys">
              <h2 data-i18n="sys.title"></h2>
              <p class="sub" data-i18n="sys.sub"></p>

              <div class="card">
                <div class="switch-row" data-switch="enabled"><span class="text" data-i18n="sys.enabled"></span></div>
                <div class="switch-row" data-switch="autoStart"><span class="text" data-i18n="sys.autoStart"></span></div>
                <div class="switch-row" data-switch="watchdogEnabled">
                  <span class="text"><span data-i18n="sys.watchdog"></span><small data-i18n="sys.watchdogSub"></small></span>
                </div>
              </div>

              <div class="card">
                <div class="field">
                  <span class="field-head"><span class="label" data-i18n="sys.appearance"></span></span>
                  <label class="field" style="margin-bottom: 18px">
                    <span class="field-head"><span class="label" data-i18n="sys.language"></span></span>
                    <div class="pill-row" id="language" role="radiogroup"></div>
                    <span class="hint" data-i18n="sys.languageHelp"></span>
                  </label>
                  <div class="segmented" data-seg="theme" style="max-width: 340px">
                    <button type="button" data-value="dark" data-i18n="app.dark"></button>
                    <button type="button" data-value="light" data-i18n="app.light"></button>
                    <button type="button" data-value="sys" data-i18n="sys.title"></button>
                  </div>
                </div>
              </div>

              <div class="card danger-card">
                <h3 data-i18n="sys.reset"></h3>
                <p class="hint" style="margin-top: 0" data-i18n="sys.resetHelp"></p>
                <div class="row"><button class="btn danger" id="btn-reset" type="button" data-i18n="sys.resetButton"></button></div>
              </div>
            </section>

            <!-- Protokoll -->
            <section class="panel" id="panel-log" hidden data-title="search.log">
              <h2 data-i18n="log.title"></h2>
              <p class="sub" data-i18n="log.sub"></p>

              <div class="log-tools">
                <button class="btn" id="btn-copy-log" type="button" data-i18n="log.copy"></button>
                <button class="btn" id="btn-open-logs" type="button" data-i18n="log.openFolder"></button>
              </div>

              <div class="log-filters" id="log-filters">
                <button class="pill" data-level="all" aria-selected="true" type="button" data-i18n="log.all"></button>
                <button class="pill" data-level="warn" aria-selected="false" type="button" data-i18n="log.warnings"></button>
                <button class="pill" data-level="error" aria-selected="false" type="button" data-i18n="log.errors"></button>
                <button class="pill" data-level="lyrics" aria-selected="false" type="button" data-i18n="log.lyrics"></button>
              </div>

              <div class="log" id="log" data-noscroll></div>
              <p class="log-foot" data-i18n="log.foot"></p>
            </section>
          </div>

          <!-- presence preview ----------------------------------------->
          <footer class="preview">
            <img class="cover" id="preview-cover" alt="" />
            <div class="preview-text">
              <div class="preview-line">
                <span class="preview-title" id="preview-title"></span>
                <span class="ph" id="ph-title" style="width: 190px"></span>
                <span class="tag" id="tag-title" data-i18n="preview.titleTag"></span>
                <span class="chip good hidden" id="preview-chip"><span class="dot on"></span><span id="preview-chip-text"></span></span>
              </div>
              <div class="preview-line second">
                <span aria-hidden="true">♪</span>
                <span class="preview-lyric" id="preview-lyric"></span>
                <span class="ph" id="ph-lyric" style="width: 260px"></span>
                <span class="tag" id="tag-lyric" data-i18n="preview.lyricTag"></span>
              </div>
              <div class="times">
                <span id="preview-elapsed">--:--</span>
                <span class="bar"><i id="preview-fill" style="width: 0%"></i></span>
                <span id="preview-total">--:--</span>
              </div>
            </div>
            <div class="preview-note" data-i18n="preview.note"></div>
          </footer>
        </div>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
