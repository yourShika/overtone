<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://i.ytimg.com https://lh3.googleusercontent.com data:; font-src 'self';"
    />
    <title>Overtone einrichten</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="wizard.css" />
  </head>
  <body>
    <div class="win">
      <header class="titlebar">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <span class="brand-name" data-i18n="wiz.windowTitle"></span>
        </div>
        <div class="titlebar-right">
          <button class="winbtn close" id="win-close" type="button" aria-label="Schließen">✕</button>
        </div>
      </header>

      <div class="body">
        <!-- step rail --------------------------------------------------->
        <nav class="rail">
          <div class="steps" id="steps">
            <button class="step" data-step="1" type="button">
              <span class="circle">1</span><span class="step-name" data-i18n="wiz.s1.title"></span>
            </button>
            <button class="step" data-step="2" type="button">
              <span class="circle">2</span><span class="step-name" data-i18n="wiz.s2.title"></span>
            </button>
            <button class="step" data-step="3" type="button">
              <span class="circle">3</span><span class="step-name" data-i18n="wiz.s3"></span>
            </button>
            <button class="step" data-step="4" type="button">
              <span class="circle">4</span><span class="step-name" data-i18n="wiz.s4.title"></span>
            </button>
          </div>

          <div class="rail-foot">
            <span class="bar thin"><i id="wiz-progress" style="width: 25%"></i></span>
            <p class="rail-note" id="wiz-note"></p>
          </div>
        </nav>

        <!-- panels ------------------------------------------------------>
        <div class="content">
          <div class="scroll" id="wiz-scroll" data-noscroll>
            <!-- 1 -->
            <section class="wpanel" id="step-1">
              <h2 data-i18n="wiz.s1.title"></h2>
              <p class="sub" data-i18n="wiz.s1.sub"></p>

              <div class="notice good" data-i18n="wiz.s1.running"></div>

              <div class="card">
                <div class="switch-row" data-switch="autoStart">
                  <span class="text"><span data-i18n="wiz.s1.autostart"></span><small data-i18n="wiz.s1.autostartSub"></small></span>
                </div>
              </div>

              <div class="notice warn" data-i18n="wiz.s1.warning"></div>
            </section>

            <!-- 2 -->
            <section class="wpanel" id="step-2" hidden>
              <h2 data-i18n="wiz.s2.title"></h2>
              <p class="sub" data-i18n="wiz.s2.sub"></p>

              <div class="card num">
                <span class="num-badge">01</span>
                <div class="num-body">
                  <h3 data-i18n="wiz.s2.c1"></h3>
                  <p class="hint" style="margin-top: 0" data-i18n="wiz.s2.c1sub"></p>
                  <div class="row">
                    <button class="btn primary" data-external="https://discord.com/developers/applications" type="button" data-i18n="conn.openPortal"></button>
                  </div>
                </div>
              </div>

              <div class="card num">
                <span class="num-badge">02</span>
                <div class="num-body">
                  <h3 data-i18n="wiz.s2.c2"></h3>
                  <p class="hint" style="margin-top: 0" data-i18n="wiz.s2.c2sub"></p>
                </div>
              </div>

              <div class="card num focus" id="card-clientid">
                <span class="num-badge">03</span>
                <div class="num-body">
                  <h3 data-i18n="wiz.s2.c3"></h3>
                  <label class="field">
                    <input id="clientId" type="text" inputmode="numeric" data-i18n-placeholder="conn.clientIdPlaceholder" placeholder="" />
                  </label>
                  <p class="status-line" id="clientid-status"><span class="dot"></span><span data-i18n="wiz.s2.waiting"></span></p>
                </div>
              </div>
            </section>

            <!-- 3 -->
            <section class="wpanel" id="step-3" hidden>
              <h2 data-i18n="wiz.s3.title"></h2>
              <p class="sub" data-i18n="wiz.s3.sub"></p>

              <div class="card num">
                <span class="num-badge">01</span>
                <div class="num-body">
                  <h3 data-i18n="wiz.s3.c1"></h3>
                  <p class="hint" style="margin-top: 0">
                    Adresse eingeben: <span class="chip mono">brave://extensions</span>
                    oder <span class="chip mono">chrome://extensions</span>
                  </p>
                </div>
              </div>

              <div class="card num">
                <span class="num-badge">02</span>
                <div class="num-body">
                  <h3 data-i18n="wiz.s3.c2"></h3>
                  <p class="hint" style="margin-top: 0" data-i18n="wiz.s3.c2sub"></p>
                </div>
              </div>

              <div class="card num">
                <span class="num-badge">03</span>
                <div class="num-body">
                  <h3 data-i18n="wiz.s3.c3"></h3>
                  <p class="hint" style="margin-top: 0" data-i18n="wiz.s3.c3sub"></p>
                  <p class="path" id="ext-path">…</p>
                  <div class="row">
                    <button class="btn" id="btn-show-ext" type="button" data-i18n="wiz.s3.showFolder"></button>
                  </div>
                </div>
              </div>

              <div class="card num">
                <span class="num-badge">04</span>
                <div class="num-body">
                  <h3 data-i18n="popup.reloadTabs"></h3>
                  <p class="hint" style="margin-top: 0" data-i18n="wiz.s3.c4sub"></p>
                </div>
              </div>

              <div class="notice warn" id="ext-waiting">
                <div class="row" style="margin: 0">
                  <span class="spinner small"></span>
                  <span>Warte auf die Erweiterung … <span class="chip mono">Port <span id="ext-port">8787</span></span></span>
                </div>
              </div>

              <div class="notice good hidden" id="ext-connected">
                <strong data-i18n="wiz.s3.connected"></strong> <span id="ext-tabs"></span>
              </div>
            </section>

            <!-- 4 -->
            <section class="wpanel" id="step-4" hidden>
              <h2 data-i18n="wiz.s4.title"></h2>
              <p class="sub" data-i18n="wiz.s4.sub"></p>

              <div class="notice bad" id="test-bad">
                <strong id="test-bad-title">Noch nicht verbunden.</strong>
                <span id="test-bad-text"></span>
              </div>

              <div class="notice good hidden" id="test-good">
                <strong>Discord und Browser verbunden.</strong> Alles bereit.
              </div>

              <div class="card">
                <h3 data-i18n="wiz.s4.discordSetting"></h3>
                <p class="hint" style="margin-top: 0" data-i18n="wiz.s4.discordSettingSub"></p>
              </div>

              <div class="card">
                <h3 data-i18n="wiz.s4.nowPlaying"></h3>
                <div class="preview-mini">
                  <img class="cover" id="wiz-cover" alt="" />
                  <div class="preview-text">
                    <div class="preview-line">
                      <span class="preview-title" id="wiz-title"></span>
                      <span class="ph" id="wiz-ph-title" style="width: 170px"></span>
                      <span class="tag" id="wiz-tag-title" data-i18n="preview.titleTag"></span>
                    </div>
                    <div class="preview-line second">
                      <span aria-hidden="true">♪</span>
                      <span class="preview-lyric" id="wiz-lyric"></span>
                      <span class="ph" id="wiz-ph-lyric" style="width: 220px"></span>
                      <span class="tag" id="wiz-tag-lyric" data-i18n="preview.lyricTag"></span>
                    </div>
                  </div>
                </div>
              </div>

              <p class="hint">
                Klemmt etwas, steht der Grund im Protokoll — in den Einstellungen unter
                <strong data-i18n="log.title"></strong>.
              </p>
            </section>
          </div>

          <footer class="wiz-foot">
            <button class="btn" id="wiz-back" type="button" data-i18n="app.back"></button>
            <button class="btn primary" id="wiz-next" type="button" data-i18n="app.next"></button>
            <button class="btn ghost" id="wiz-later" type="button" data-i18n="app.later"></button>
          </footer>
        </div>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="wizard.js"></script>
  </body>
</html>
