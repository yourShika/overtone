<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Overtone Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span class="mark" aria-hidden="true"></span>
      <span class="name" data-i18n="popup.name"></span>
    </header>

    <section class="status" id="status">
      <span class="dot" id="status-dot"></span>
      <div class="status-text">
        <p class="status-title" id="status-title" data-i18n="popup.connecting"></p>
        <p class="status-sub" id="status-sub"></p>
      </div>
    </section>

    <section class="block">
      <p class="block-label" data-i18n="popup.activeTab"></p>
      <div class="tab-row">
        <span class="thumb" id="tab-thumb"></span>
        <div class="tab-text">
          <div class="tab-line">
            <span class="tab-title" id="tab-title"></span>
            <span class="ph" id="ph-title"></span>
          </div>
          <div class="tab-line second">
            <span class="tab-by" id="tab-by"></span>
            <span class="ph small" id="ph-by"></span>
          </div>
        </div>
      </div>
    </section>

    <label class="field">
      <span class="label" data-i18n="popup.bridgePort"></span>
      <input id="port" type="number" min="1024" max="65535" placeholder="8787" />
    </label>

    <div class="switch-row" id="captions-row">
      <span class="text" data-i18n="popup.captions"></span>
    </div>

    <button class="btn wide" id="reload-tabs" type="button" data-i18n="popup.reloadTabs"></button>

    <script src="popup.js"></script>
  </body>
</html>
